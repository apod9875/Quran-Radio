<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2A22"/>
      <stop offset="100%" stop-color="#071712"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE38A"/>
      <stop offset="50%" stop-color="#E2BA55"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2BA55" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E2BA55" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#E2BA55" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Audio broadcast waves (top) -->
  <path d="M 216 140 A 60 60 0 0 1 296 140" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 188 112 A 100 100 0 0 1 324 112" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 160 84 A 140 140 0 0 1 352 84" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Radio signal center dot -->
  <circle cx="256" cy="154" r="10" fill="url(#goldGrad)"/>

  <!-- Holy Quran Book base & stand -->
  <!-- Rihal / Quran Stand -->
  <path d="M 160 380 L 352 380 L 310 420 L 202 420 Z" fill="#16342B" stroke="#E2BA55" stroke-width="4"/>
  <path d="M 190 380 L 256 340 L 322 380" fill="none" stroke="#E2BA55" stroke-width="6" stroke-linecap="round"/>

  <!-- Open Holy Quran Book Pages -->
  <!-- Left Page -->
  <path d="M 256 330 C 230 310, 160 300, 110 320 C 110 250, 110 220, 110 210 C 160 190, 230 200, 256 220 Z" 
        fill="#122A23" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round"/>
  <!-- Right Page -->
  <path d="M 256 330 C 282 310, 352 300, 402 320 C 402 250, 402 220, 402 210 C 352 190, 282 200, 256 220 Z" 
        fill="#122A23" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round"/>

  <!-- Book spine line -->
  <line x1="256" y1="220" x2="256" y2="330" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- Quranic Calligraphy lines on pages -->
  <!-- Left page lines -->
  <line x1="140" y1="235" x2="230" y2="230" stroke="#E2BA55" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="135" y1="255" x2="235" y2="250" stroke="#E2BA55" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="135" y1="275" x2="235" y2="270" stroke="#E2BA55" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="140" y1="295" x2="230" y2="290" stroke="#E2BA55" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- Right page lines -->
  <line x1="282" y1="230" x2="372" y2="235" stroke="#E2BA55" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="277" y1="250" x2="377" y2="255" stroke="#E2BA55" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="277" y1="270" x2="377" y2="275" stroke="#E2BA55" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="282" y1="290" x2="372" y2="295" stroke="#E2BA55" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
</svg>
